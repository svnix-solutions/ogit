name: PR

on:
  pull_request:
    branches:
      - main
      - refactor

permissions:
  contents: read

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version-file: web/.nvmrc
        cache: npm
        cache-dependency-path: web/package-lock.json

    - run: npm ci
      working-directory: web
    - name: Typecheck
      run: npm run typecheck
      working-directory: web
    - name: Test
      run: npm test
      working-directory: web

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum

    - uses: actions/setup-node@v4
      with:
        node-version-file: web/.nvmrc
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Build web UI
      run: npm --prefix web ci && npm --prefix web run build

    - name: Check formatting
      run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race -count=1 ./...

    - uses: nowsprinting/check-version-format-action@v3
      if: github.event_name != 'pull_request'
      id: version
      with:
        prefix: 'v'

    - name: Build app
      run: CGO_ENABLED=1 GOOS=linux go build -a -ldflags '-linkmode external -extldflags "-static" -X "main.version=${{ steps.version.outputs.full }}"' -o bin/app cmd/cmd.go
  integration:
    name: Integration (MinIO, Mailpit, Postgres)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum

    # testcontainers starts MinIO, Mailpit, Redis and Postgres through the runner's Docker daemon.
    - name: Integration tests (MinIO, Mailpit, Redis)
      run: go test -race -count=1 -tags=integration -run 'MinIO|Mailpit|Redis' ./...

    - name: End-to-end tests on Postgres
      run: go test -race -count=1 -tags=integration ./interfaces/cli/server/
      env:
        OGIT_TEST_DB: postgres
