name: Docs

# Builds the documentation site (docs/, VitePress) on pull requests, and
# publishes it to GitHub Pages on pushes to main (the github-pages
# environment only allows main).
on:
  pull_request:
    branches: [main]
    paths: ["docs/**", "config-example.yaml", ".github/workflows/docs.yaml"]
  push:
    branches: [main]
    paths: ["docs/**", "config-example.yaml", ".github/workflows/docs.yaml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Docs
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Docs deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
