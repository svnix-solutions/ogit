# oGit configuration. Copy to config.yaml and pass with -c config.yaml.
# Every key can also be set with a flag (--http.port) or an environment
# variable (HTTP_PORT); flags win over env vars, env vars over this file.
# Values shown are the defaults unless noted.

http:
  port: 8080
  logs: false          # access log for every request
  public_url: ""       # externally reachable base URL, e.g. https://git.example.com (needed for email links)
  trusted_proxies: []  # reverse proxies (IPs/CIDRs) whose X-Forwarded-For/-Proto are believed, e.g. ["10.0.0.0/8"]

logger:
  level: info          # debug, info, warn, error
  pretty: false        # human-readable output instead of JSON

database:
  dialect: sqlite      # sqlite or postgres
  dsn: ./database.sqlite
  # postgres example: "host=localhost user=local password=local dbname=local port=5432 sslmode=disable"

session:
  # HMAC key for session tokens, at least 32 bytes (e.g. `openssl rand -hex 32`).
  # If unset, a random key is generated at startup and sessions do not survive restarts.
  secret_key: ""
  expiration_minutes: 43200   # 30 days
  issuer: ogit

security:
  # Encrypts secrets stored in the database (authenticator app seeds for
  # two-factor authentication), at least 32 bytes (`openssl rand -hex 32`).
  # Keep it: changing it turns off app-based 2FA for everyone (recovery codes
  # still work). Unset: users can't add an authenticator app.
  encryption_key: ""
  # Require two-factor authentication from every user. When false, site
  # admins can still turn the requirement on from the admin page.
  require_2fa: false
  # Sign in only through sign-in providers (sso.providers or the admin
  # page): no password or passkey sign-in and no registration, except for
  # the user names in sso_only_exempt (keep a local admin there). When
  # false, site admins can still turn it on from the admin page.
  sso_only: false
  sso_only_exempt: []   # e.g. [root]

registration:
  enabled: true
  domain_whitelist: []        # e.g. ["example.com"]; empty allows any domain
  password_min_length: 12
  password_complexity: true   # upper and lower case, digit and symbol
  # New users must open a link sent by email before they can log in.
  # Needs smtp.host, smtp.from and http.public_url. Existing accounts, and
  # accounts created while this is off, count as verified.
  require_email_verification: false
  verification_ttl_hours: 24
  verification_url_template: "{public_url}/api/v1/auth/verify?token={token}"

ratelimit:             # "N/window"; "0" turns a rule off. Exceeding one answers 429 with Retry-After.
  enabled: true
  store: memory        # memory (per server) or redis (shared by every server)
  redis_url: ""        # redis only, e.g. redis://localhost:6379/1
  login_ip: 10/15m     # failed logins, password checks and git token checks per IP
  login_account: 50/15m  # failed logins per account, from any IP
  register_ip: 5/1h    # registrations and verification emails per IP
  api_user: 600/1m     # API requests per signed-in user
  api_anonymous: 120/1m  # API requests per IP without a session
  git_user: 300/1m     # git operations, raw files and archives per token, user or SSH key
  git_anonymous: 60/1m # the same per IP without credentials

webhooks:
  # Deliveries to private, loopback, link-local and shared addresses are
  # refused (checked on the address actually dialed). List hosts, IPs or
  # CIDRs here to allow some, e.g. an internal CI server.
  allowed_hosts: []    # e.g. [ci.internal, 10.0.5.0/24]
  timeout: 10s         # per delivery attempt

mirrors:
  # Pull mirrors and imports fetch remote repositories; like webhooks they
  # may not reach private, loopback, link-local or shared addresses unless
  # listed here (e.g. an internal git server).
  allowed_hosts: []    # e.g. [git.internal, 10.0.5.0/24]
  min_interval: 10m    # shortest sync interval of a mirror
  default_interval: 8h # interval of new mirrors

sso:
  # Group sync (per provider): groups_claim (default "groups"; a dotted path
  # such as realm_access.roles works), admin_group (members are site
  # admins; sync also takes back what it granted, never from the last
  # admin) and group_mappings ([{group: <IdP group>, target: <oGit group>,
  # role: member|maintainer}]): synced at each sign-in, removing only the
  # memberships sync added. Sign-in only through providers:
  # security.sso_only and security.sso_only_exempt.
  # Sign-in providers declared here are read-only in the admin page (which
  # can add more). They need http.public_url: register
  # {http.public_url}/api/v1/auth/sso/<slug>/callback at the provider.
  # client_secret may name environment variables.
  providers: []
  # - slug: keycloak            # in URLs (a-z, 0-9, -)
  #   name: Company SSO         # on the sign-in button
  #   kind: oidc                # oidc or github
  #   issuer: https://sso.example.com/realms/main   # github: omit (or an Enterprise server's URL)
  #   client_id: ogit
  #   client_secret: ${OGIT_OIDC_SECRET}
  #   scopes: ""                # extra scopes, space separated
  #   allowed_domains: ""       # e.g. "example.com, example.org": only these verified emails
  #   allowed_orgs: ""          # github: one of these organizations
  #   auto_create: true         # new users get an account
  #   require_two_factor: false # ask oGit's 2FA too (else the provider's MFA is trusted)
  #   groups_claim: groups
  #   admin_group: ogit-admins
  #   group_mappings:
  #     - {group: engineering, target: eng, role: member}
  #   enabled: true
  # - slug: okta                # SAML 2.0
  #   name: Okta
  #   kind: saml
  #   issuer: https://corp.okta.com/app/xyz/sso/saml/metadata   # or saml.metadata_xml
  #   client_secret: ${OGIT_SAML_KEY}   # the SP's private key (PEM); the admin page makes one itself
  #   groups_claim: groups              # the groups attribute
  #   saml:
  #     certificate: |                  # the SP's certificate (PEM), with that key
  #       -----BEGIN CERTIFICATE-----
  #     allow_idp_initiated: false
  #     email_attribute: ""             # default: email, mail, ...
  # - slug: corp-ad             # LDAP / Active Directory: the sign-in form
  #   name: Corp directory
  #   kind: ldap
  #   issuer: ldaps://ad.example.com
  #   client_id: cn=ogit,ou=services,dc=example,dc=com   # service account (optional)
  #   client_secret: ${OGIT_LDAP_PASSWORD}
  #   admin_group: ogit-admins
  #   ldap:
  #     user_base: ou=people,dc=example,dc=com
  #     user_filter: ""             # default (&(objectClass=person)(|(uid={input})(mail={input})))
  #     username_attribute: uid     # AD: sAMAccountName
  #     subject_attribute: entryUUID   # AD: objectGUID
  #     member_of_attribute: ""     # AD: memberOf; else group_base and group_filter
  #     group_base: ou=groups,dc=example,dc=com
  #     start_tls: false
  #     root_ca: ""                 # PEM

releases:
  max_asset_size: 104857600   # bytes (100 MB) per uploaded asset

git:
  max_push_size: 2147483648   # bytes (2 GB) per push, over HTTP and SSH; 0 for no limit

lfs:
  max_object_size: 2147483648   # bytes (2 GB) per Git LFS object

packages:
  max_file_size: 2147483648     # bytes (2 GB) per package file or container layer

actions:
  artifact_retention_days: 90   # a workflow's retention-days can only shorten it
  max_artifact_size: 2147483648 # bytes (2 GB) per artifact
  cache_size_limit: 10737418240 # bytes (10 GB) of actions/cache entries per repository

ssh:                   # git over SSH: ssh://git@host:2222/<repo>.git
  enabled: false
  port: 2222
  host_key_path: ./ssh_host_ed25519_key   # generated on first start; keep it (in Docker: a volume)

smtp:                  # outgoing mail, used for email verification
  host: ""
  port: 587
  username: ""         # optional
  password: ""
  from: ""             # e.g. "oGit <git@example.com>"
  tls: starttls        # starttls, tls (implicit, usually port 465) or none

storage:
  type: local          # local or s3
  local:
    path: ./repositories
  s3:                  # used when type is s3; path-style addressing (MinIO, Outscale, ...)
    bucket: ""
    endpoint: ""       # e.g. https://s3.eu-west-2.amazonaws.com or http://localhost:9000
    accesskey: ""
    secretkey: ""
    region: us-east-1
    cache:             # pack indexes and 4 MiB pack blocks read from S3 (packs never change)
      type: memory     # memory (per server), redis (shared by every server) or none
      max_mb: 256      # memory only: LRU size limit
      redis_url: ""    # redis only, e.g. redis://localhost:6379/0
