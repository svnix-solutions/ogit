# oGit configuration. Copy to config.yaml and pass with -c config.yaml.
# Every key can also be set with a flag (--http.port) or an environment
# variable (HTTP_PORT); flags win over env vars, env vars over this file.
# Values shown are the defaults unless noted.

http:
  port: 8080
  logs: false          # access log for every request
  public_url: ""       # externally reachable base URL, e.g. https://git.example.com (needed for email links)
  trusted_proxies: []  # reverse proxies (IPs/CIDRs) whose X-Forwarded-For/-Proto are believed, e.g. ["10.0.0.0/8"]

logger:
  level: info          # debug, info, warn, error
  pretty: false        # human-readable output instead of JSON

database:
  dialect: sqlite      # sqlite or postgres
  dsn: ./database.sqlite
  # postgres example: "host=localhost user=local password=local dbname=local port=5432 sslmode=disable"

session:
  # HMAC key for session tokens, at least 32 bytes (e.g. `openssl rand -hex 32`).
  # If unset, a random key is generated at startup and sessions do not survive restarts.
  secret_key: ""
  expiration_minutes: 43200   # 30 days
  issuer: ogit

registration:
  enabled: true
  domain_whitelist: []        # e.g. ["example.com"]; empty allows any domain
  password_min_length: 12
  password_complexity: true   # upper and lower case, digit and symbol
  # New users must open a link sent by email before they can log in.
  # Needs smtp.host, smtp.from and http.public_url. Existing accounts, and
  # accounts created while this is off, count as verified.
  require_email_verification: false
  verification_ttl_hours: 24
  verification_url_template: "{public_url}/api/v1/auth/verify?token={token}"

ratelimit:             # "N/window"; "0" turns a rule off. Exceeding one answers 429 with Retry-After.
  enabled: true
  store: memory        # memory (per server) or redis (shared by every server)
  redis_url: ""        # redis only, e.g. redis://localhost:6379/1
  login_ip: 10/15m     # failed logins, password checks and git token checks per IP
  login_account: 50/15m  # failed logins per account, from any IP
  register_ip: 5/1h    # registrations and verification emails per IP
  api_user: 600/1m     # API requests per signed-in user
  api_anonymous: 120/1m  # API requests per IP without a session
  git_user: 300/1m     # git operations, raw files and archives per token, user or SSH key
  git_anonymous: 60/1m # the same per IP without credentials

webhooks:
  # Deliveries to private, loopback, link-local and shared addresses are
  # refused (checked on the address actually dialed). List hosts, IPs or
  # CIDRs here to allow some, e.g. an internal CI server.
  allowed_hosts: []    # e.g. [ci.internal, 10.0.5.0/24]
  timeout: 10s         # per delivery attempt

releases:
  max_asset_size: 104857600   # bytes (100 MB) per uploaded asset

git:
  max_push_size: 2147483648   # bytes (2 GB) per push, over HTTP and SSH; 0 for no limit

ssh:                   # git over SSH: ssh://git@host:2222/<repo>.git
  enabled: false
  port: 2222
  host_key_path: ./ssh_host_ed25519_key   # generated on first start; keep it (in Docker: a volume)

smtp:                  # outgoing mail, used for email verification
  host: ""
  port: 587
  username: ""         # optional
  password: ""
  from: ""             # e.g. "oGit <git@example.com>"
  tls: starttls        # starttls, tls (implicit, usually port 465) or none

storage:
  type: local          # local or s3
  local:
    path: ./repositories
  s3:                  # used when type is s3; path-style addressing (MinIO, Outscale, ...)
    bucket: ""
    endpoint: ""       # e.g. https://s3.eu-west-2.amazonaws.com or http://localhost:9000
    accesskey: ""
    secretkey: ""
    region: us-east-1
    cache:             # pack indexes and 4 MiB pack blocks read from S3 (packs never change)
      type: memory     # memory (per server), redis (shared by every server) or none
      max_mb: 256      # memory only: LRU size limit
      redis_url: ""    # redis only, e.g. redis://localhost:6379/0
