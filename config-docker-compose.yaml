# oGit configuration for docker-compose.yaml: PostgreSQL, S3 (MinIO) and
# Redis, all on the Compose network. Mounted as /config/config.yaml.
#
# This is a showcase: the keys and passwords below are public. Before using
# it for real, set your own (openssl rand -hex 32), preferably as environment
# variables (SESSION_SECRET_KEY, SECURITY_ENCRYPTION_KEY, ...), which win over
# this file. config-example.yaml documents every setting.

http:
  port: 8080
  # Where people reach oGit. Change it (e.g. https://git.example.com behind
  # a TLS proxy) when you run it anywhere but your own machine: it's used in
  # links, webhooks, SSO callbacks and passkeys.
  public_url: http://localhost:8080
  trusted_proxies: []

logger:
  level: info
  pretty: false

database:
  dialect: postgres
  dsn: "host=db user=ogit password=ogit-showcase dbname=ogit port=5432 sslmode=disable"

session:
  secret_key: "showcase-only-session-key-change-me-0123456789"   # at least 32 bytes

security:
  # Encrypts secrets kept in the database (authenticator apps, SSO and
  # mirror credentials, Actions secrets). Keep it once you have data.
  encryption_key: "showcase-only-encryption-key-change-me-012345"   # at least 32 bytes

registration:
  enabled: true

# Rate limit counters shared through Redis, as several servers would.
ratelimit:
  enabled: true
  store: redis
  redis_url: redis://redis:6379/1

ssh:
  enabled: true
  port: 2222
  host_key_path: /data/ssh_host_ed25519_key   # on the ogit-data volume: keep it

storage:
  type: s3
  s3:
    bucket: ogit                     # created by the s3-init service
    endpoint: http://s3:9000
    accesskey: ogit-showcase
    secretkey: ogit-showcase-secret
    region: us-east-1
    cache:
      type: redis                    # pack data cached in Redis, shared by every server
      redis_url: redis://redis:6379/0
